[project]
name = "doxa"
version = "1.18.0"
description = "A terminal for coding agents with auditable memory."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
    # No "License ::" classifier: PEP 639 retired those in favour of the
    # SPDX expression above.
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Terminals",
]
dependencies = [
    "claude-agent-sdk>=0.2.144",
    "textual>=5,<6",
    "textual-image>=0.12.0",
    # NOT a new dependency: textual-image has always required Pillow and it
    # has always been on disk. What changed in v0.41.0 is who imports it.
    # doxa.banner opens assets/logo.png itself -- it has to, because
    # textual-image normalizes with PIL's convert("RGB"), which discards
    # alpha instead of compositing it, and the logo's transparent
    # background would render as a white slab on a dark theme. So the
    # banner crops and flattens the image before handing it over, and this
    # line moves up out of the dev group on the rule that group's own
    # comment already stated: code that imports `PIL.Image` directly earns
    # its own declaration rather than riding another package's coattails.
    # scripts/record_gif.py, the previous holder of that comment, is
    # covered by this line too.
    "pillow>=11",
    # DOXA's memory model IS lore_core -- doxa.engine, doxa.peers,
    # doxa.operators and doxa.transcript all import it, and until v0.37.0
    # it was declared nowhere: a bare clone reached into a LORE Claude
    # Code plugin checkout through a sys.path shim and, finding none,
    # failed 41 of 52 test modules at collection.
    #
    # A git URL because neither project is on PyPI (the README's install
    # section says the same of DOXA itself). Pinned to a COMMIT rather
    # than a branch: a branch pin re-resolves to whatever LORE main is
    # that day, which is how a dependency becomes a moving target.
    #
    # This is the commit that gave LORE its packaging metadata (0.35.1).
    # It becomes `@v0.35.1` once that release is tagged -- a tag reads
    # better, and until then there is no tag on a LORE that can be
    # installed at all.
    #
    # Nobody has to remember to make that edit:
    # .github/workflows/lore-bump.yml checks weekly for a LORE tag ahead of
    # this ref, and when one appears it rewrites the line below, re-locks,
    # runs the suite and opens a PR. It only ever proposes -- this line is
    # still only changed by a human merging one. Editing it by hand stays
    # perfectly fine; the workflow reads whatever is here.
    "lore-core @ git+https://github.com/docwilde/LORE@v0.58.0",
]

[project.optional-dependencies]
remote = [
    "starlette>=1,<2",
    "uvicorn>=0.52,<1",
    "websockets>=15,<17",
]

[project.scripts]
doxa = "doxa.cli:main"
# The name README.md and docs/fleet.md have used since the harness landed.
# Until now it existed in the prose and nowhere else: `doxa-fleet --pool ...`
# was a command that did not exist, and the working spelling was `python -m
# doxa.fleet`. Same entry point either way -- doxa/fleet.py's main() is what
# `python -m doxa.fleet` already calls.
doxa-fleet = "doxa.fleet:main"
doxa-remote = "doxa.remote_web:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `lore-core @ git+https://...` is a PEP 508 direct reference, which
# hatchling refuses by default -- the guard exists because PyPI rejects a
# distribution carrying one, and it is worth being told rather than
# finding out at upload. DOXA is not on PyPI and never will be (the
# installer runs `uv tool install git+https://github.com/docwilde/doxa`),
# so the guard is describing a rule that does not apply here.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["doxa"]

# The launcher icon is the repo's own assets/icon.png, mapped into the
# package at build time (doxa.launcher reads it via importlib.resources)
# -- one file in git, no duplicate under doxa/. The banner logo joins it
# on exactly those terms: doxa.banner draws assets/logo.png at the top of
# every session's opening block, so an INSTALLED doxa has to carry it.
# Without this line the banner would be a source-checkout-only feature and
# silently nothing for everyone who installed the documented way.
[tool.hatch.build.targets.wheel.force-include]
"assets/icon.png" = "doxa/assets/icon.png"
"assets/logo.png" = "doxa/assets/logo.png"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
