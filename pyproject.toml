[project]
name = "doxa"
version = "0.32.0"
description = "A terminal for working with a Claude agent whose memory you can audit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.144",
    "textual>=5,<6",
    "textual-image>=0.12.0",
]

[project.scripts]
doxa = "doxa.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    # scripts/record_gif.py's own frame-assembly step (rasterized SVG ->
    # palette-quantized GIF) -- already on disk transitively via
    # textual-image, but a script that imports `PIL.Image` directly earns
    # its own line here rather than riding an app dependency's coattails.
    "pillow>=11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doxa"]

# The launcher icon is the repo's own assets/icon.png, mapped into the
# package at build time (doxa.launcher reads it via importlib.resources)
# -- one file in git, no duplicate under doxa/.
[tool.hatch.build.targets.wheel.force-include]
"assets/icon.png" = "doxa/assets/icon.png"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
