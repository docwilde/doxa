[project]
name = "doxa"
version = "2.0.0a41"
description = "Development compatibility reference for the native DOXA terminal."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
    # No "License ::" classifier: PEP 639 retired those in favour of the
    # SPDX expression above.
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Terminals",
]
dependencies = []

[dependency-groups]
dev = [
    # Historical Python UI/SDK and canonical APIs are test oracles only.
    "claude-agent-sdk>=0.2.144",
    "textual>=5,<6",
    "textual-image>=0.12.0",
    "pillow>=11",
    "starlette>=1,<2",
    "uvicorn>=0.52,<1",
    "websockets>=15,<17",
    "lore-core @ git+https://github.com/docwilde/LORE@4e8bb3d573f7c52df5b26d3dad11d52e9007afbe",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doxa"]

# The launcher icon is the repo's own assets/icon.png, mapped into the
# package at build time (doxa.launcher reads it via importlib.resources)
# -- one file in git, no duplicate under doxa/. The banner logo joins it
# on exactly those terms: doxa.banner draws assets/logo.png at the top of
# every session's opening block, so an INSTALLED doxa has to carry it.
# Without this line the banner would be a source-checkout-only feature and
# silently nothing for everyone who installed the documented way.
[tool.hatch.build.targets.wheel.force-include]
"assets/icon.png" = "doxa/assets/icon.png"
"assets/logo.png" = "doxa/assets/logo.png"
"assets/mesh" = "doxa/assets/mesh"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
