[project]
name = "doxa"
version = "0.8.0"
description = "A terminal for working with a Claude agent whose memory you can audit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.144",
    "textual>=5,<6",
    "textual-image>=0.12.0",
]

[project.scripts]
doxa = "doxa.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doxa"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
