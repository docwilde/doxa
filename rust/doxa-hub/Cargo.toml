[package]
name = "doxa-hub"
version = "2.0.0-beta.8"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[dependencies]
doxa-peers = { path = "../doxa-peers" }
serde_json = "1"
libc = "0.2"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "signal", "macros", "sync", "io-util"] }
uuid = { version = "1", features = ["v4"] }
subtle = "2"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
web-push-native = "0.5"

[dev-dependencies]
tempfile = "3"
