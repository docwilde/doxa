[package]
name = "doxa-engines"
version = "2.0.0-alpha.16"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
