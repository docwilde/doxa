[package]
name = "doxa-state"
version = "2.0.0-alpha.12"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
