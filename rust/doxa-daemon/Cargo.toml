[package]
name = "doxa-daemon"
version = "2.0.0-beta.4"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[dependencies]
doxa-state = { path = "../doxa-state" }
doxa-runtime = { path = "../doxa-runtime" }
doxa-engines = { path = "../doxa-engines" }
doxa-lore = { path = "../doxa-lore" }
doxa-transcript = { path = "../doxa-transcript" }
doxa-claude = { path = "../doxa-claude" }
doxa-vendors = { path = "../doxa-vendors" }
doxa-peers = { path = "../doxa-peers" }
doxa-worktrees = { path = "../doxa-worktrees" }
libc = "0.2"
sha2 = "0.10"
time = { version = "0.3", features = ["parsing"] }
futures-util = "0.3"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "time", "sync", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
doxa-tui = { path = "../doxa-tui" }

[features]
local-test-server = ["doxa-vendors/local-test-server"]
