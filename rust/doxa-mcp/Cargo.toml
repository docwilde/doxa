[package]
name = "doxa-mcp"
version = "2.0.0-beta.47"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[dependencies]
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "macros", "rt", "net"] }

[dev-dependencies]
tempfile = "3"

