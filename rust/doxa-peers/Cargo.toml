[package]
name = "doxa-peers"
version = "2.0.0-alpha.15"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
