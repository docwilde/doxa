[package]
name = "doxa-tui"
version = "2.0.0-alpha.68"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[[bin]]
name = "doxa-rs"
path = "src/main.rs"

[dependencies]
doxa-claude = { path = "../doxa-claude" }
doxa-engines = { path = "../doxa-engines" }
doxa-peers = { path = "../doxa-peers" }
doxa-state = { path = "../doxa-state" }
doxa-worktrees = { path = "../doxa-worktrees" }
doxa-vendors = { path = "../doxa-vendors" }
doxa-lore = { path = "../doxa-lore" }
crossterm = "0.28"
doxa-protocol = { path = "../doxa-protocol" }
libc = "0.2"
pulldown-cmark = "0.13"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }
toml = "0.8"
tokio = { version = "1", features = ["rt", "time", "net", "sync", "macros"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
futures-util = "0.3"
unicode-width = "0.2"
tui-nodes = "=0.9.0"

[dev-dependencies]
tempfile = "3"
