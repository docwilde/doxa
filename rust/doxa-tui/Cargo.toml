[package]
name = "doxa-tui"
version = "2.0.0-beta.20"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[[bin]]
name = "doxa-rs"
path = "src/main.rs"

[dependencies]
doxa-codegraph = { path = "../doxa-codegraph" }
doxa-fleet = { path = "../doxa-fleet" }
doxa-isolation = { path = "../doxa-isolation" }
doxa-claude = { path = "../doxa-claude" }
doxa-engines = { path = "../doxa-engines" }
doxa-peers = { path = "../doxa-peers" }
doxa-state = { path = "../doxa-state" }
doxa-worktrees = { path = "../doxa-worktrees" }
doxa-vendors = { path = "../doxa-vendors" }
doxa-lore = { path = "../doxa-lore" }
doxa-remote-wire = { path = "../doxa-remote-wire" }
crossterm = "0.28"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ratatui-image = { version = "=8.0.2", default-features = false, features = ["crossterm"] }
doxa-protocol = { path = "../doxa-protocol" }
libc = "0.2"
pulldown-cmark = "0.13"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }
toml = "0.8"
tokio = { version = "1", features = ["rt", "time", "net", "sync", "macros"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
uuid = { version = "1", features = ["v4"] }
unicode-width = "0.2"
tui-nodes = "=0.9.0"
wasmparser = { version = "=0.261.0", default-features = false, features = ["std", "validate", "features"] }
wasmi = { version = "=2.0.0", default-features = false, features = ["std", "stable", "validate", "auto-dispatch", "extra-checks"] }

[dev-dependencies]
tempfile = "3"
wat = "=1.261.0"
