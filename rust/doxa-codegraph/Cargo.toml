[package]
name = "doxa-codegraph"
version = "2.0.0-beta.14"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[[bin]]
name = "doxa-codegraph"
path = "src/main.rs"

[dependencies]
libc = "0.2"
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "parsing", "visit"] }

[dev-dependencies]
tempfile = "3"
