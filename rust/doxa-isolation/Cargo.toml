[package]
name = "doxa-isolation"
version = "2.0.0-beta.39"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[[bin]]
name = "doxa-isolation-worker"
path = "src/main.rs"

[[bin]]
name = "doxa-quota-helper"
path = "src/bin/doxa-quota-helper.rs"

[dependencies]
errno = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
