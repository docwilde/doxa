[package]
name = "doxa-fleet"
version = "2.0.0-beta.90"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[dependencies]
doxa-protocol = { path = "../doxa-protocol" }
doxa-state = { path = "../doxa-state" }
doxa-isolation = { path = "../doxa-isolation" }
doxa-vendors = { path = "../doxa-vendors" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "time", "net"] }

[dev-dependencies]
# Preserve exact host floats when the offline request fixture reads its plan.
serde_json = { version = "1", features = ["float_roundtrip"] }
tempfile = "3"

[features]
test-transport = []

[[example]]
name = "review_evaluation"
test = true

[[example]]
name = "checkpoint_requests"
test = true
