name: LORE bump

# Proposes an immutable native LORE upgrade for human review. Cargo is the
# runtime pin; the Python dev dependency is the interoperability oracle.
# Both pins and locks move together. This workflow never merges a proposal.

on:
  schedule:
    # Mondays, 04:17 UTC. Weekly matches LORE's release pace -- daily would
    # re-ask a question whose answer changes a few times a month. Monday so
    # a proposal is already waiting at the start of the week rather than
    # landing mid-Friday. 04:17 rather than 04:00 because GitHub's scheduled
    # queue is heavily oversubscribed on the hour and on-the-hour crons are
    # the ones that get delayed; 04:xx UTC is the middle of the night in the
    # Americas and pre-dawn in Europe, so the ~12 runner-minutes an actual
    # bump costs never compete with a human waiting on PR CI. Cron is UTC
    # and does not observe DST, so this does not wander with the clocks.
    - cron: "17 4 * * 1"
  # The whole thing is runnable on demand, which is the difference between
  # this workflow and ci.yml: it can be exercised for real, once, from the
  # Actions tab the moment it lands on main, instead of waiting a week to
  # find out whether it works.
  workflow_dispatch:

# Read-only by default. The one job that needs to write says so itself.
permissions:
  contents: read

concurrency:
  # Never cancel: two runs must not race to force-push the same proposal
  # branch, and a run that is already nine minutes into the suite has more
  # value than the one that would replace it.
  group: lore-bump
  cancel-in-progress: false

env:
  # One machine-owned branch, reused. See "Idempotency" on the push step.
  BUMP_BRANCH: automation/lore-bump

jobs:
  propose:
    name: Propose a LORE upgrade
    runs-on: ubuntu-latest
    # Native builds and the workspace fixtures run only for a new release.
    timeout-minutes: 45

    permissions:
      # Push the proposal branch...
      contents: write
      # ...and open or update the PR that carries it. Nothing else, and
      # nothing at all on any other job.
      pull-requests: write

    env:
      # `gh` is preinstalled on the runner and reads this. Using it instead of
      # a third-party create-pull-request action keeps the supply chain of a
      # workflow that opens PRs against this repo down to two actions, both
      # first-party-ish and both pinned to a tag that was verified to exist.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out doxa
        uses: actions/checkout@v7

      # Runs on the runner's system python3 -- stdlib only, before uv exists,
      # so the ordinary "nothing to do" answer costs no dependency sync.
      # --write rewrites both pins only when the answer is
      # `propose`; on `none` it changes nothing at all.
      - name: Decide whether a newer LORE tag exists
        id: decide
        run: python3 scripts/lore_bump.py --write

      - name: Nothing to propose
        if: steps.decide.outputs.action != 'propose'
        # Through env, not `${{ }}` inside the shell: every value this
        # workflow interpolates ultimately derives from a tag name in another
        # repository, and none of them should ever reach a shell as syntax.
        env:
          REASON: ${{ steps.decide.outputs.reason }}
        run: echo "::notice::$REASON"

      - name: Install uv
        if: steps.decide.outputs.action == 'propose'
        # Pinned to a real release tag. astral-sh/setup-uv publishes v10.0.1
        # but no floating v10 -- `@v10` 404s at job setup, which is how this
        # repo's first CI workflow died. Verified against the git refs API.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Select stable Rust
        if: steps.decide.outputs.action == 'propose'
        run: rustup toolchain install stable --profile minimal

      - name: Re-lock against the proposed LORE tag
        if: steps.decide.outputs.action == 'propose'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail
          # A lock failure here is not the signal this workflow is for. The
          # tag was already confirmed to carry packaging metadata before we
          # got as far as installing uv, so if uv still cannot resolve it,
          # something is wrong with the release itself -- and there is no
          # lockfile to propose. Fail the RUN (red, and it mails), rather
          # than open a PR whose branch does not build.
          if ! uv lock 2>&1 | tee uv-lock.log; then
            echo "::error::uv could not lock lore-core at $TAG -- see log"
            {
              echo "### uv lock failed against \`$TAG\`"
              echo
              echo '```'
              tail -n 40 uv-lock.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Resolve through a stable workspace package: changing the git rev
          # removes the old lore-core package ID before cargo update can select it.
          cargo +stable check --package doxa-lore
          git --no-pager diff --stat -- rust/doxa-lore/Cargo.toml Cargo.lock pyproject.toml uv.lock

      # Idempotency, part one: has a human already said no to this exact
      # proposal? A closed (not merged) PR with this tag's title is a
      # decision, and re-opening it every Monday would be nagging.
      - name: Look for an existing proposal
        if: steps.decide.outputs.action == 'propose'
        id: existing
        env:
          TITLE: "chore(deps): bump lore-core to ${{ steps.decide.outputs.tag }}"
        run: |
          set -euo pipefail
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

          declined=$(gh pr list --head "$BUMP_BRANCH" --state all --limit 30 \
            --json number,title,state \
            --jq '[.[] | select(.state == "CLOSED" and .title == env.TITLE)] | first | .number // empty')
          if [ -n "$declined" ]; then
            echo "::notice::PR #$declined already proposed this exact bump and was closed unmerged; not re-opening it."
            echo "skip=declined" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          open_pr=$(gh pr list --head "$BUMP_BRANCH" --state open --limit 5 \
            --json number --jq 'first | .number // empty')
          echo "pr=$open_pr" >> "$GITHUB_OUTPUT"

          # Idempotency, part two: is the branch already carrying exactly
          # these native/oracle manifests and locks? Then the suite has already run
          # against it and its verdict is already in the PR body. Re-running
          # nine minutes of tests to reach the same answer is the cost this
          # check exists to avoid -- and it is checked BEFORE the suite, not
          # after.
          # Explicit refspec: actions/checkout narrows `remote.origin.fetch`
          # to the checked-out branch, so a bare `git fetch origin <branch>`
          # would move FETCH_HEAD and leave no origin/<branch> to diff against.
          # Braced deliberately: `$BUMP_BRANCH:refs/...` unbraced is a
          # word-modifier to some shells, which silently rewrites the refspec
          # into nonsense rather than failing loudly.
          git fetch --no-tags origin \
            "+refs/heads/${BUMP_BRANCH}:refs/remotes/origin/${BUMP_BRANCH}" || true
          if git rev-parse --verify -q "origin/$BUMP_BRANCH" >/dev/null \
             && git diff --quiet "origin/$BUMP_BRANCH" -- rust/doxa-lore/Cargo.toml Cargo.lock pyproject.toml uv.lock \
             && [ -n "$open_pr" ]; then
            echo "::notice::PR #$open_pr already proposes exactly this change; nothing to do."
            echo "skip=unchanged" >> "$GITHUB_OUTPUT"
          fi

      - name: Test native runtime and interoperability against the proposed pin
        if: steps.decide.outputs.action == 'propose' && steps.existing.outputs.skip == ''
        id: suite
        continue-on-error: true
        env:
          CARGO_BUILD_JOBS: "2"
          RUST_TEST_THREADS: "1"
          DOXA_LORE_RS: ${{ github.workspace }}/target/debug/lore-rs
          DOXA_TEST_LORE_RS: ${{ github.workspace }}/target/debug/lore-rs
        run: |
          set -euo pipefail
          uv sync --frozen --python 3.12
          export DOXA_LORE_PYTHON="$GITHUB_WORKSPACE/.venv/bin/python"
          export DOXA_CLAUDE_PYTHON="$DOXA_LORE_PYTHON"
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"
          cargo +stable build --locked --package lore-core --bin lore-rs
          native_tests=$(mktemp -d "$RUNNER_TEMP/lore-upgrade-XXXXXX")
          trap 'rm -rf "$native_tests"' EXIT
          export TMPDIR="$native_tests"
          HOME="$native_tests/home" "$DOXA_LORE_RS" memory show
          cargo +stable test --locked --workspace --all-features 2>&1 | tee native-tests.log
          uv run --no-sync python -m pytest -q -rf --tb=short \
            tests/test_native_lore_carrier.py tests/test_native_lore_interop.py \
            tests/test_native_lore_diagnostics.py tests/test_native_provider_lore.py \
            tests/test_native_agent_tools.py tests/test_lore_capacity.py \
            tests/test_review_worker.py tests/test_install_rust.py \
            tests/test_lore_bump.py tests/test_task_native.py \
            --basetemp="$native_tests/pytest" 2>&1 | tee pytest.log

      - name: Open or update the proposal
        if: steps.decide.outputs.action == 'propose' && steps.existing.outputs.skip == ''
        env:
          TAG: ${{ steps.decide.outputs.tag }}
          SLUG: ${{ steps.decide.outputs.slug }}
          OLD_REF: ${{ steps.decide.outputs.pinned_ref }}
          REASON: ${{ steps.decide.outputs.reason }}
          TITLE: ${{ steps.existing.outputs.title }}
          OPEN_PR: ${{ steps.existing.outputs.pr }}
          SUITE: ${{ steps.suite.outcome }}
        run: |
          set -euo pipefail

          if [ "$SUITE" = "success" ]; then
            verdict="**Native workspace and interoperability gates pass on this pin.**"
            tally="$(grep -E '(passed|failed|error)' pytest.log | tail -n 1 || echo 'see the run log')"
          else
            verdict="**The native upgrade gates do NOT pass on this pin.** LORE moved in a way DOXA cannot take yet -- do not merge until that is understood."
            tally="$(grep -E '(passed|failed|error)' pytest.log | tail -n 1 || echo 'the suite did not get far enough to report a tally')"
          fi

          {
            echo "$REASON"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| was | \`$OLD_REF\` |"
            echo "| now | \`$TAG\` |"
            echo "| suite | $tally |"
            echo
            echo "$verdict"
            if [ -f pytest.log ] && grep -q '^FAILED' pytest.log; then
              echo
              echo "#### Failed tests"
              echo
              grep '^FAILED' pytest.log | sed 's/^FAILED /- `/; s/ - /` - /'
            fi
            echo
            echo "Diff in LORE: https://github.com/$SLUG/compare/$OLD_REF...$TAG"
            echo
            echo "---"
            echo
            echo "The native Cargo pin and Python dev interoperability oracle both use the same immutable release commit."
            echo
            echo 'These gates were run by the proposal workflow. GITHUB_TOKEN PRs do not trigger additional rust-ci.yml runs; a maintainer push triggers normal PR CI.'
            echo
            echo "Opened by \`.github/workflows/lore-bump.yml\`. It never merges anything."
          } > pr-body.md

          # Force-push, and no rebase dance: this branch is machine-owned and
          # its only content is the CURRENT proposal, rebuilt from the tip of
          # main on every run. There is nothing human on it to lose.
          #
          # Idempotency, part three: one branch and therefore at most one open
          # LORE-bump PR, ever. A newer tag SUPERSEDES the previous proposal
          # in place rather than opening a second PR beside it -- nobody
          # should have to work out which of three bump PRs is the one to
          # take. The trade is that a PR under review can change tag beneath
          # the reviewer; the title and the table above always name the tag
          # currently proposed.
          git checkout -b "$BUMP_BRANCH"
          git add rust/doxa-lore/Cargo.toml Cargo.lock pyproject.toml uv.lock
          # Identity passed per-command rather than written into the repo's
          # git config -- nothing here should outlive the step.
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "$TITLE" -m "$REASON"
          # --force, not --force-with-lease: the only writer that could lose
          # the race is another run of this same workflow, and the
          # `lore-bump` concurrency group already serializes those. A lease
          # would additionally fail whenever the remote-tracking ref was not
          # fetched -- e.g. the first run, when the branch does not exist.
          git push --force origin "$BUMP_BRANCH"

          if [ -n "$OPEN_PR" ]; then
            gh pr edit "$OPEN_PR" --title "$TITLE" --body-file pr-body.md
            echo "::notice::updated PR #$OPEN_PR to propose $TAG"
          elif ! gh pr create --base main --head "$BUMP_BRANCH" \
                 --title "$TITLE" --body-file pr-body.md; then
            # One repo setting decides whether this line can ever work:
            # Settings -> Actions -> General -> Workflow permissions ->
            # "Allow GitHub Actions to create and approve pull requests".
            # It is OFF by default (repos/<owner>/<repo>/actions/permissions/
            # workflow reports it as can_approve_pull_request_reviews), and
            # with it off GITHUB_TOKEN pushes branches fine and is refused at
            # `pr create`. The branch above is already pushed and already
            # tested, so say exactly that and where to click, rather than
            # leaving a maintainer to read a 403 out of a log.
            echo "::error::could not open the pull request. Enable Settings -> Actions -> General -> \"Allow GitHub Actions to create and approve pull requests\". The proposal branch is pushed and tested; open it by hand meanwhile: https://github.com/${GITHUB_REPOSITORY}/compare/main...${BUMP_BRANCH}?expand=1"
            exit 1
          fi

          cat pr-body.md >> "$GITHUB_STEP_SUMMARY"

      # The PR exists either way -- a red one is the point. But the scheduled
      # run itself should also go red so it lands in the Actions mail rather
      # than waiting to be noticed.
      - name: Fail the run if the proposed pin does not pass
        if: steps.decide.outputs.action == 'propose' && steps.existing.outputs.skip == '' && steps.suite.outcome != 'success'
        run: |
          echo "::error::the proposed LORE bump does not pass the suite; the PR is open and red on purpose"
          exit 1
