name: LORE bump

# Candidate source is built in an unprivileged job. A separate fresh runner
# validates its small artifact before the narrowly scoped publication step.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lore-bump
  cancel-in-progress: false

env:
  BUMP_BRANCH: automation/lore-bump

jobs:
  verify:
    name: Verify candidate without write credentials
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      action: ${{ steps.decide.outputs.action }}
      suite: ${{ steps.suite.outcome }}
    steps:
      - name: Check out the base revision without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Public GitHub API reads use Python's stdlib; this job has no token in
      # its environment and executes candidate build scripts only after the
      # decision has been made.
      - name: Decide whether a newer LORE tag exists
        id: decide
        run: python3 scripts/lore_bump.py --write

      - name: Nothing to propose
        if: steps.decide.outputs.action != 'propose'
        run: echo "::notice::No newer installable LORE release is available."

      - name: Select stable Rust
        if: steps.decide.outputs.action == 'propose'
        run: rustup toolchain install stable --profile minimal

      - name: Re-lock against the immutable LORE commit
        if: steps.decide.outputs.action == 'propose'
        run: |
          set -euo pipefail
          cargo +stable update --manifest-path rust/doxa-lore/Cargo.toml --package lore-core
          cargo +stable check --locked --package doxa-lore

      - name: Test native runtime against the proposed pin
        if: steps.decide.outputs.action == 'propose'
        id: suite
        continue-on-error: true
        env:
          CARGO_BUILD_JOBS: "2"
          RUST_TEST_THREADS: "1"
          DOXA_LORE_RS: ${{ github.workspace }}/target/debug/lore-rs
          DOXA_TEST_LORE_RS: ${{ github.workspace }}/target/debug/lore-rs
        run: |
          set -euo pipefail
          cargo +stable build --locked --package lore-core --bin lore-rs
          native_tests=$(mktemp -d "$RUNNER_TEMP/lore-upgrade-XXXXXX")
          trap 'rm -rf "$native_tests"' EXIT
          export TMPDIR="$native_tests"
          HOME="$native_tests/home" "$DOXA_LORE_RS" memory show
          cargo +stable test --locked --workspace --all-features 2>&1 | tee native-tests.log

      # The artifact is untrusted input. Only these three bounded files cross
      # the job boundary; the publisher independently rechecks their contents.
      - name: Prepare candidate artifact
        if: steps.decide.outputs.action == 'propose'
        env:
          BASE_SHA: ${{ github.sha }}
          TAG: ${{ steps.decide.outputs.tag }}
          COMMIT: ${{ steps.decide.outputs.commit }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          directory = Path("candidate-artifact")
          directory.mkdir(mode=0o700)
          native = Path("rust/doxa-lore/Cargo.toml").read_bytes()
          lock = Path("Cargo.lock").read_bytes()
          (directory / "native-Cargo.toml").write_bytes(native)
          (directory / "Cargo.lock").write_bytes(lock)
          metadata = {
              "schema": 1,
              "base_sha": os.environ["BASE_SHA"],
              "tag": os.environ["TAG"],
              "commit": os.environ["COMMIT"],
              "native_manifest_sha256": hashlib.sha256(native).hexdigest(),
              "cargo_lock_sha256": hashlib.sha256(lock).hexdigest(),
          }
          (directory / "candidate.json").write_text(json.dumps(metadata, sort_keys=True) + "\n")
          PY

      - name: Upload candidate artifact
        if: steps.decide.outputs.action == 'propose'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lore-bump-candidate
          path: |
            candidate-artifact/candidate.json
            candidate-artifact/native-Cargo.toml
            candidate-artifact/Cargo.lock
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Validate and publish proposal
    needs: verify
    if: github.ref == 'refs/heads/main' && needs.verify.outputs.action == 'propose'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Check out a clean base revision without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download candidate artifact into a fresh workspace
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lore-bump-candidate
          path: candidate

      # This is trusted base-branch Python. It does not import, build, or
      # execute anything from the candidate artifact.
      - name: Validate candidate identity and bounded changes
        id: validate
        env:
          EXPECTED_BASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/lore_bump.py --validate-candidate-artifact candidate \
            --expected-base "$EXPECTED_BASE" \
            --native-manifest-baseline rust/doxa-lore/Cargo.toml
          cp candidate/native-Cargo.toml rust/doxa-lore/Cargo.toml
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_BASE"

      # Cargo resolves the lockfile from the trusted baseline lock and the
      # independently checked immutable manifest pin, using the same targeted
      # update as the verifier. This command only resolves package metadata;
      # it does not build, run tests, or execute candidate build scripts. The
      # untrusted artifact lock is comparison input only and cannot define its
      # own allowed dependency closure.
      - name: Resolve and compare the lock with trusted Cargo
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          cargo +stable update --manifest-path rust/doxa-lore/Cargo.toml --package lore-core
          python3 scripts/lore_bump.py --compare-candidate-lock candidate/Cargo.lock Cargo.lock

      - name: Check exact publication diff
        run: |
          set -euo pipefail
          actual=$(git diff --name-only | LC_ALL=C sort)
          expected=$(printf '%s\n' Cargo.lock rust/doxa-lore/Cargo.toml | LC_ALL=C sort)
          test "$actual" = "$expected"
          git diff --check

      # Credentials appear only in this final, fixed-command publication step.
      # Git receives an in-memory config value for this push; no remote auth is
      # written into the checkout or a persistent credential store.
      - name: Open or update the proposal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.validate.outputs.tag }}
          PINNED_REF: ${{ steps.validate.outputs.pinned_ref }}
          SUITE: ${{ needs.verify.outputs.suite }}
        run: |
          set -euo pipefail
          title="chore(deps): bump lore-core to $TAG"
          if [ "$SUITE" = success ]; then
            verdict="Native workspace gates passed in the unprivileged verification job."
          else
            verdict="Native workspace gates failed in the unprivileged verification job; review before merging."
          fi
          body_file="$RUNNER_TEMP/lore-bump-pr-body.md"
          cat > "$body_file" <<EOF
          Automated proposal for immutable LORE release \`$TAG\`.

          $verdict

          Compare: https://github.com/docwilde/LORE/compare/$PINNED_REF...$TAG

          This PR was published from a fresh checkout after artifact validation. It is never merged automatically.
          EOF

          export TITLE="$title"
          declined=$(gh pr list --head "$BUMP_BRANCH" --state all --limit 30 \
            --json number,title,state \
            --jq '[.[] | select(.state == "CLOSED" and .title == env.TITLE)] | first | .number // empty')
          if [ -n "$declined" ]; then
            echo "::notice::PR #$declined already proposed this exact bump and was closed unmerged."
            exit 0
          fi
          open_pr=$(gh pr list --head "$BUMP_BRANCH" --state open --limit 5 --json number --jq 'first | .number // empty')
          git checkout -b "$BUMP_BRANCH"
          git add rust/doxa-lore/Cargo.toml Cargo.lock
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "$title" -m "Proposed after isolated candidate verification."
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="$auth_header" \
            git push --force "https://github.com/${GITHUB_REPOSITORY}.git" "$BUMP_BRANCH"
          if [ -n "$open_pr" ]; then
            gh pr edit "$open_pr" --title "$title" --body-file "$body_file"
          else
            gh pr create --base main --head "$BUMP_BRANCH" --title "$title" --body-file "$body_file"
          fi
          cat "$body_file" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the run if the proposed pin did not pass
        if: needs.verify.outputs.suite != 'success'
        run: |
          echo "::error::The proposed LORE pin failed its unprivileged verification suite."
          exit 1
