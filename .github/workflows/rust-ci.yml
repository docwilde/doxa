name: Rust 2.0 CI

on:
  pull_request:
  push:
    branches: ["main", "rust/2.0"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  RUST_TEST_THREADS: "1"
  DOXA_LORE_RS: ${{ github.workspace }}/target/debug/lore-rs
  TMPDIR: /home/runner/.doxa-tests

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare private test directory
        run: |
          mkdir -p "$HOME/.t"
          chmod 700 "$HOME/.t"
          echo "TMPDIR=$HOME/.t" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Check native macOS build
        run: cargo check --locked --workspace
      - name: Build daemon and native LORE carrier for interaction tests
        run: |
          cargo build --locked
          cargo build --locked --package lore-core --bin lore-rs
      - name: Smoke macOS application shortcut
        run: |
          HOME="$RUNNER_TEMP/doxa-launcher-home" target/debug/doxa-rs install-launcher "$GITHUB_WORKSPACE/target/debug/doxa-rs"
          test -x "$RUNNER_TEMP/doxa-launcher-home/Applications/DOXA.command"
      - name: Test portable macOS Rust workspace
        run: cargo test --locked --workspace --exclude doxa-daemon --features doxa-vendors/local-test-server --no-fail-fast
      - name: Test portable macOS daemon suites
        run: |
          cargo test --locked -p doxa-daemon --bin doxa-daemon --features local-test-server
          cargo test --locked -p doxa-daemon --features local-test-server \
            --test codex_legacy_protection \
            --test lore_review_policy \
            --test vendor_compaction \
            --test vendor_streaming
          cargo test --locked -p doxa-daemon --features local-test-server --test process
      - name: Verify macOS native vendor lifecycle against local SSE
        run: |
          cargo build --locked -p doxa-daemon --features local-test-server
          DOXA_NATIVE_DAEMON="$GITHUB_WORKSPACE/target/debug/doxa-daemon" \
            python3 -m unittest discover -s scripts/tests -p test_native_live_vendor_verifier.py -v
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify packaged remote browser client
        run: |
          node --test browser-extension/tests/*.test.mjs
          mkdir -p target
          scripts/package-browser-extension.sh "$GITHUB_WORKSPACE/target/doxa-remote-extension-ci.zip"
          unzip -tqq target/doxa-remote-extension-ci.zip
      - name: Select stable Rust
        run: |
          mkdir -p "$TMPDIR"
          chmod 700 "$TMPDIR"
          rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Build native runtime and LORE carrier
        run: |
          cargo +stable build --locked
          cargo +stable build --locked --package lore-core --bin lore-rs
      - name: Test native runtime, providers and interaction
        run: cargo +stable test --locked --workspace --features doxa-daemon/local-test-server,doxa-vendors/local-test-server
      - name: Check task, quota fixture and release installer
        run: |
          sh -n scripts/install.sh task
          ./task help
          # Stdlib-only checks for the protected provider's build tooling.
          python3 -W error::ResourceWarning -m unittest discover \
            -s scripts/tests -p test_codex_protected_installer.py -v
          python3 -W error::ResourceWarning -m unittest discover \
            -s scripts/tests -p test_codex_code_mode_proof.py -v
          python3 -W error::ResourceWarning -m unittest discover \
            -s scripts/tests -p test_lore_bump.py -v
          python3 -W error::ResourceWarning -m unittest discover \
            -s scripts/tests -p test_claude_auto_permissions_verifier.py -v
          python3 -W error::ResourceWarning -m unittest discover \
            -s scripts/tests -p test_session_image_package.py -v
          python3 -W error::ResourceWarning scripts/test_docker_quota_preflight.py -v
          python3 -W error::ResourceWarning scripts/test_docker_hard_quota_probe.py -v
          python3 -W error::ResourceWarning -m unittest discover \
            -s scripts/tests -p test_plugin_delegated_host_proof.py -v
      - name: Smoke installed Rust launcher without a Python environment
        run: |
          smoke_dir=$(mktemp -d "$TMPDIR/install-XXXXXXXX")
          trap 'rm -rf "$smoke_dir"' EXIT
          DOXA_RUST_REPO_URL="$GITHUB_WORKSPACE" \
            DOXA_HOME="$smoke_dir/home" \
            DOXA_RUST_BIN_DIR="$smoke_dir/bin" \
            DOXA_INSTALL_TARGET_DIR="$GITHUB_WORKSPACE/target" \
            CARGO_BUILD_JOBS=2 \
            DOXA_NO_LAUNCHER=1 \
            sh scripts/install.sh HEAD
          (cd / && "$smoke_dir/bin/doxa" --version)
          "$smoke_dir/bin/doxa-isolation-worker" --self-test
          test -x "$smoke_dir/bin/doxa-plugin-worker"
          test ! -e "$smoke_dir/home/sidecars"
          test ! -e "$smoke_dir/bin/.doxa-sidecar-current"
          HOME="$smoke_dir/owned-home" "$smoke_dir/bin/lore-rs" memory show
          XDG_DATA_HOME="$smoke_dir/desktop" "$smoke_dir/bin/doxa" install-launcher "$smoke_dir/bin/doxa"
          test -f "$smoke_dir/desktop/applications/doxa.desktop"
          test -f "$smoke_dir/desktop/icons/hicolor/scalable/apps/doxa.svg"
