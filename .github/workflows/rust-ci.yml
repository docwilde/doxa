name: Rust 2.0 CI

on:
  pull_request:
  push:
    branches: ["main", "rust/2.0"]

permissions:
  contents: read

env:
  RUST_TEST_THREADS: "1"
  DOXA_LORE_RS: ${{ github.workspace }}/target/debug/lore-rs
  TMPDIR: /home/runner/.doxa-tests

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Rust
        run: |
          mkdir -p "$TMPDIR"
          chmod 700 "$TMPDIR"
          rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Build native runtime and LORE carrier
        run: |
          cargo +stable build --locked
          cargo +stable build --locked --package lore-core --bin lore-rs
      - name: Test native runtime, providers and interaction
        run: cargo +stable test --locked --workspace --features doxa-daemon/local-test-server,doxa-vendors/local-test-server
      - name: Check task and release installer
        run: |
          sh -n scripts/install.sh task
          ./task help
      - name: Smoke installed Rust launcher without a Python environment
        run: |
          smoke_dir=$(mktemp -d "$TMPDIR/install-XXXXXXXX")
          trap 'rm -rf "$smoke_dir"' EXIT
          DOXA_RUST_REPO_URL="$GITHUB_WORKSPACE" \
            DOXA_HOME="$smoke_dir/home" \
            DOXA_RUST_BIN_DIR="$smoke_dir/bin" \
            DOXA_NO_LAUNCHER=1 \
            sh scripts/install.sh HEAD
          (cd / && "$smoke_dir/bin/doxa" --version)
          test ! -e "$smoke_dir/home/sidecars"
          test ! -e "$smoke_dir/bin/.doxa-sidecar-current"
          HOME="$smoke_dir/owned-home" "$smoke_dir/bin/lore-rs" memory show
          XDG_DATA_HOME="$smoke_dir/desktop" "$smoke_dir/bin/doxa" install-launcher "$smoke_dir/bin/doxa"
          test -f "$smoke_dir/desktop/applications/doxa.desktop"
          test -f "$smoke_dir/desktop/icons/hicolor/scalable/apps/doxa.svg"
