name: CI

on:
  push:
    branches: [main]
  pull_request:

# One 785-test suite is ~9 minutes of wall clock per matrix leg, so a second
# push to the same PR should retire the first run rather than race it.
# Pushes to main are deliberately NOT cancelled: each one is the only run that
# will ever attest to that commit, and they are rare enough not to be the cost
# problem PR iteration is.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Which LORE the plugin-precedence leg checks out. lore_core is a real
  # pyproject dependency since v0.37.0, pinned to a commit, so the OTHER
  # legs need no LORE checkout at all -- they are the bare-clone case, which
  # is the one that used to fail 41 of 52 test modules at collection.
  #
  # This leg exists because a bare clone is not what most machines are: a
  # user with the LORE Claude Code plugin installed gets the plugin's
  # lore_core, which wins over the pinned one (doxa/_lore_bootstrap.py says
  # why -- one shared SQLite store, and the plugin is its busier writer).
  # The plugin marketplace tracks LORE main, so tracking main here is what
  # those machines actually run, and a LORE change that breaks DOXA turns
  # this leg red before a user finds it. Pin to a SHA if that trade stops
  # being worth it -- still a one-line change.
  LORE_REF: main

jobs:
  test:
    # Named per leg, because two of the three now run the same Python and
    # differ only in whether a LORE plugin is present.
    name: py${{ matrix.python-version }}${{ matrix.lore-plugin && ' + LORE plugin' || '' }}
    runs-on: ubuntu-latest
    # The suite measured 8m34s locally; runners are slower, and some tests
    # spawn daemons over Unix sockets that could in principle hang. 25
    # minutes leaves ~2.5x headroom over the measured time while capping a
    # wedged daemon well short of burning a runner hour.
    timeout-minutes: 25

    env:
      # Set ONLY on the plugin leg. Empty everywhere else, which sends
      # doxa/_lore_bootstrap to its default location -- a path that does not
      # exist on a runner, so the pinned lore-core dependency is what loads.
      # That is the bare-clone case, and it is asserted below rather than
      # assumed.
      DOXA_LORE_CORE_PATH: ${{ matrix.lore-plugin && format('{0}/.lore-plugin', github.workspace) || '' }}

    strategy:
      # One leg's failure is worth seeing next to the others' results, and
      # each leg is ~9 minutes -- not worth re-running to learn the second answer.
      fail-fast: false
      matrix:
        # Deliberately three legs, not five, and not one per Python. The
        # first two are the bare-clone case -- nothing but `uv sync`, which
        # is the whole point of declaring lore-core: pyproject says
        # requires-python = ">=3.11", so 3.11 keeps that claim honest, and
        # .python-version pins 3.12, which is what contributors and releases
        # actually run. 3.13/3.14 are claimed nowhere in the project metadata
        # and each leg costs another ~9 runner-minutes.
        python-version: ["3.11", "3.12"]
        lore-plugin: [false]
        include:
          # Third leg: a machine WITH the LORE plugin, i.e. the other branch
          # of doxa/_lore_bootstrap's precedence and the configuration most
          # real users are in. One Python is enough -- the axis under test
          # here is which lore_core wins, not which interpreter runs it.
          - python-version: "3.12"
            lore-plugin: true

    steps:
      - name: Check out doxa
        uses: actions/checkout@v7

      # Only for the plugin leg. Everywhere else lore_core arrives through
      # the pinned dependency like any other package, and there is nothing
      # to check out.
      - name: Check out LORE (simulates an installed plugin)
        if: matrix.lore-plugin
        uses: actions/checkout@v7
        with:
          repository: docwilde/LORE
          ref: ${{ env.LORE_REF }}
          path: .lore-plugin

      - name: Install uv
        # Pinned to a real release tag: astral-sh/setup-uv publishes v10.0.1
        # but no floating v10, so `@v10` fails to resolve at job setup.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # Keyed on uv.lock by default: a lockfile change busts it, an
          # unrelated source change reuses it.
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies
        # --frozen: install exactly uv.lock, never silently re-resolve it.
        # The dev group (pytest, pytest-asyncio) is included by default.
        run: uv sync --frozen --python ${{ matrix.python-version }}

      # The claim this whole workflow now rests on, checked before nine
      # minutes of tests: on a bare clone lore_core comes from the declared
      # dependency, and on a machine with the plugin the plugin wins. A leg
      # that silently loaded the wrong one would still be green and would
      # be testing something other than what it says.
      - name: Check which lore_core was loaded
        run: |
          uv run --no-sync python - <<'PY'
          import os, sys
          from doxa import _lore_bootstrap, version
          print(version.about_text())
          source = _lore_bootstrap.resolved_source()
          if source is None:
              sys.exit("::error::no lore_core could be imported at all")
          kind, location = source
          expected = "plugin" if os.environ.get("DOXA_LORE_CORE_PATH") else "package"
          if kind != expected:
              sys.exit(f"::error::expected lore_core from the {expected}, got {kind} at {location}")
          PY

      - name: Run test suite
        # -rf prints a "FAILED <nodeid> - <reason>" line per failure, which
        # the summary step lifts verbatim; --tb=short keeps the log readable.
        #
        # One suite, no deselect, no retry budget anywhere. Until v0.38.0
        # tests/test_tab_status.py::test_done_unseen_marks_a_background_tab_
        # and_clears_on_activation was deselected here and re-run on its own
        # with three attempts, because SessionPane focused its prompt on mount
        # and that focus ACTIVATED its tab, asynchronously, after the key press
        # the test was asserting about (measured 7 failures in 40 standalone
        # runs on this machine). Focus ownership moved to the app, the race is
        # gone -- 40/40 standalone runs after the fix -- and the scaffolding
        # went with it: a retry wrapped around a fixed test only hides the next
        # regression in it.
        run: |
          set -o pipefail
          uv run --no-sync python -m pytest -q -rf --tb=short 2>&1 | tee pytest.log

      - name: Summarize result
        # Runs even when the suite failed -- that is the case it exists for.
        if: always()
        run: |
          {
            echo "### Python ${{ matrix.python-version }}${{ matrix.lore-plugin && ' + LORE plugin' || ' (bare clone)' }}"
            echo
            if [ -f pytest.log ]; then
              # pytest's own one-line tally, e.g. "784 passed in 513.85s".
              tail -n 5 pytest.log | grep -E '(passed|failed|error)' | tail -n 1 || true
              echo
              # The point of the whole step: name the failures in the summary
              # so nobody has to expand a 500-line log to learn what broke.
              if grep -q '^FAILED' pytest.log; then
                echo "#### Failed tests"
                echo
                grep '^FAILED' pytest.log | sed 's/^FAILED /- `/; s/ - /` - /'
              fi
            else
              echo "Suite did not produce a log (setup failed before pytest ran)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # Inline annotations on the run itself, same information.
          if [ -f pytest.log ]; then
            grep '^FAILED' pytest.log | while IFS= read -r line; do
              echo "::error::${line#FAILED }"
            done
          fi

      - name: Upload pytest log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-log-py${{ matrix.python-version }}${{ matrix.lore-plugin && '-lore-plugin' || '' }}
          path: pytest.log
          if-no-files-found: ignore
